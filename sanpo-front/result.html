<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>sanpo / 透明化レポート</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="透明化レポート結果ページ" />

  <style>
    :root {
      --bg: #0b0f14;
      --panel: #11161d;
      --panel-light: #161d26;
      --accent: #7dd3fc;
      --accent-soft: rgba(125, 211, 252, 0.12);
      --text-main: #e2e8f0;
      --text-sub: #94a3b8;
      --radius: 14px;
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at top, #1e293b 0%, #0b0f14 60%);
      color: var(--text-main);
      font-family: var(--font);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 880px;
      padding: 32px 16px 48px;
    }

    .card {
      background: var(--panel);
      border-radius: var(--radius);
      padding: 26px 24px 28px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 650;
      letter-spacing: 0.02em;
    }

    .loading {
      font-size: 14px;
      color: var(--text-sub);
      margin-top: 12px;
    }

    .error {
      font-size: 14px;
      color: #f87171;
      margin-top: 12px;
    }

    .result-block {
      margin-top: 16px;
      padding: 16px;
      background: var(--panel-light);
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.08);
      white-space: pre-wrap;
      font-size: 14px;
      line-height: 1.6;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
    }
  </style>
</head>

<body>
  <div class="container">

    <section class="card">
      <h1>透明化レポート</h1>
      <p id="loading" class="loading">分析中です…</p>
      <p id="error" class="error" style="display:none;"></p>
      <div id="result" class="result-block" style="display:none;"></div>

      <a href="index.html" class="back-link">← URL を入力し直す</a>
    </section>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const targetUrl = params.get("url");

    const loadingEl = document.getElementById("loading");
    const errorEl = document.getElementById("error");
    const resultEl = document.getElementById("result");

    if (!targetUrl) {
      loadingEl.style.display = "none";
      errorEl.textContent = "URL パラメータが見つかりません。";
      errorEl.style.display = "block";
    } else {
      fetch("https://sanpo-api.sanpo-os.com/api?url=" + encodeURIComponent(targetUrl))
        .then(res => res.json())
        .then(data => {
          loadingEl.style.display = "none";

          if (data.error) {
            errorEl.textContent = "エラー: " + data.error;
            errorEl.style.display = "block";
            return;
          }

          resultEl.textContent = JSON.stringify(data, null, 2);
          resultEl.style.display = "block";
        })
        .catch(err => {
          loadingEl.style.display = "none";
          errorEl.textContent = "API エラーが発生しました: " + err;
          errorEl.style.display = "block";
        });
    }
  </script>
</body>
</html>
