<!DOCTYPE html>
<html>
<body>

<pre id="raw">読み込み中...</pre>

<script>
const params = new URLSearchParams(location.search);
const targetUrl = params.get("url");

if (!targetUrl) {
  document.getElementById("raw").textContent = "URLが指定されていません";
  throw new Error("No URL");
}

const PROXY = "https://sanpo-proxy.udsmail.workers.dev";

console.log("fetching:", targetUrl);

fetch(PROXY + "?url=" + encodeURIComponent(targetUrl))
  .then(res => res.json())
  .then(data => {
    document.getElementById("raw").textContent = JSON.stringify(data, null, 2);
  })
  .catch(err => {
    document.getElementById("raw").textContent = "エラー: " + err;
  });
</script>

</body>
</html>
