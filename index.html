<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sanpo</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    input {
      padding: 10px;
      font-size: 16px;
      width: 300px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>URLを入力</h2>

<input id="urlInput" type="text" placeholder="https://example.com">
<button onclick="go()">送信</button>

<script>
function go() {
  const url = document.getElementById("urlInput").value.trim();

  if (!url) {
    alert("URLを入力してください");
    return;
  }

  // URL の形式が怪しい場合でも result.html 側で処理できるようにする
  const encoded = encodeURIComponent(url);
  location.href = "result.html?url=" + encoded;
}
</script>

</body>
</html>
