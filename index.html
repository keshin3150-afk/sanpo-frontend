<!DOCTYPE html>
<html>
<body>

<input id="urlInput" type="text" placeholder="URLを入力">
<button onclick="go()">送信</button>

<script>
function go() {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) {
    alert("URLを入力してください");
    return;
  }
  location.href = "result.html?url=" + encodeURIComponent(url);
}
</script>

</body>
</html>
